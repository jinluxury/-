    var best = null, bestD = Infinity;
    for (var r in REGION_CENTER) {

      var c = REGION_CENTER[r];
      var dx = (c[0] - lng) * Math.cos(lat * Math.PI / 180);
      var dy = c[1] - lat;
      var d = dx * dx + dy * dy;
      if (d < bestD) { bestD = d; best = r; }
    }
    return best;
  }

        else ipLocate(manual, finish, "定位显示你不在国内，");
      }, function () {
        if (done) return;
        done = true; clearTimeout(timer);
        ipLocate(manual, finish);
      }, { enableHighAccuracy: false, timeout: manual ? 8000 : 3500, maximumAge: 600000 });
    } catch (err) {
      if (!done) { done = true; clearTimeout(timer); ipLocate(manual, finish); }
    }
  }

  function ipLocate(manual, finish, prefix) {
    var settled = false;
    var end = function () { if (finish) finish(); };
    var to = setTimeout(function () {
      if (settled) return; settled = true;
      end();
      if (!localized) failGeo((prefix || "") + "自动定位不了（可以直接手动选地区）");
    }, 6000);

    var urls = [
      "https://ipapi.co/json/",
      "https://ipwho.is/",
      "https://api.ip.sb/geoip"
    ];
    var idx = 0;

    function tryNext() {
      if (settled) return;
      if (idx >= urls.length) {
        clearTimeout(to);
        if (!settled) { settled = true; end(); if (!localized) failGeo((prefix || "") + "自动定位不了（可以直接手动选地区）"); }
        return;
      }
      var url = urls[idx++];
      fetch(url, { cache: "no-store" }).then(function (res) { return res.json(); }).then(function (d) {
        if (settled) return;
        var lng = Number(d.longitude != null ? d.longitude : d.lon);
        var lat = Number(d.latitude != null ? d.latitude : d.lat);
        var cc = String(d.country_code || d.countryCode || d.country || "").toUpperCase();
        if (isFinite(lng) && isFinite(lat) && (inChina(lng, lat) || cc === "CN")) {
          settled = true; clearTimeout(to); end();
          if (inChina(lng, lat)) applyGeo(lng, lat, "网络");
          else failGeo("网络定位显示你在境外，留在中国玩嘛～手动选个地区吧");
        } else if (isFinite(lng) && isFinite(lat) && cc && cc !== "CN") {
          settled = true; clearTimeout(to); end();
          failGeo("网络定位显示你在境外，手动选个地区吧");
        } else {
          tryNext();
        }
      }).catch(function () { tryNext(); });
    }
    tryNext();
  }

  geoBtn.addEventListener("click", function (e) { e.stopPropagation(); autoLocate(true); });

  /* ===================== 抽菜 ===================== */
  function drawDish() {
    var pool = (current === ALL_KEY) ? ALL_POOL : FOODS[current].map(function (n) { return { name: n, region: current }; });
    if (!pool.length) pool = ALL_POOL;
    var pick = pool[Math.floor(Math.random() * pool.length)];
    // 尽量避免连续两次一样
    if (pool.length > 1 && lastPick && pick.name === lastPick.name) {
      pick = pool[(pool.indexOf(pick) + 1 + Math.floor(Math.random() * (pool.length - 1))) % pool.length];
    }
    return pick;
  }

  function render(pick) {
    rDish.textContent = pick.name;
    rBadge.textContent = "今天吃";
    rMeta.textContent = (pick.region === "全国") ? "来源：全国随机" : "📍 " + pick.region + "  ·  附近的地方菜";
    var fl = FLAVOR_HINTS[pick.region] || ["地方风味"];
    var html = "";
    html += '<span class="tag">' + pick.region + "</span>";
    for (var i = 0; i < fl.length; i++) html += '<span class="tag warm">' + fl[i] + "</span>";
    html += '<span class="tag">共 ' + (current === ALL_KEY ? ALL_POOL.length : FOODS[current].length) + " 道可选</span>";
    rTags.innerHTML = html;
    resultEl.classList.add("show");
    void resultEl.offsetWidth;
    pushHistory(pick);
  }

  function roll() {
    if (rollBtn.disabled) return;
    rollBtn.disabled = true;
    fishWrap.classList.add("thinking");
    var original = rollBtn.textContent;
    var frames = ["抽 取 中", "抽 取 中 ·", "抽 取 中 · ·", "抽 取 中 · · ·"];
    var fi = 0;
    rollBtn.textContent = frames[0];
    var spin = setInterval(function () { fi = (fi + 1) % frames.length; rollBtn.textContent = frames[fi]; }, 130);

    var pool = (current === ALL_KEY) ? ALL_POOL : FOODS[current];
    // 池子大就多转一会儿，显得有在认真挑
    var dur = Math.min(1000, 420 + pool.length * 6);

    setTimeout(function () {
      clearInterval(spin);
      var pick = drawDish();
      lastPick = pick;
      render(pick);
      fishWrap.classList.remove("thinking");
      rollBtn.disabled = false;
      rollBtn.textContent = original;
    }, dur);
  }

  rollBtn.addEventListener("click", roll);
  $("againBtn").addEventListener("click", function () { resultEl.classList.remove("show"); setTimeout(roll, 120); });
  $("copyBtn").addEventListener("click", function () {
    if (!lastPick) return;
    var txt = lastPick.name + "（" + lastPick.region + "）";
    copy(txt);
    toast("已复制：" + txt);
  });

  function copy(txt) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).catch(function () { fallbackCopy(txt); });
    } else { fallbackCopy(txt); }
  }
  function fallbackCopy(txt) {
    try {
      var ta = document.createElement("textarea");
      ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select(); document.execCommand("copy");
      document.body.removeChild(ta);
    } catch (e) {}
  }

  /* ===================== 历史记录 ===================== */
  function loadHistory() {
    try {
      var raw = localStorage.getItem(HISTORY_KEY);
      var arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr.slice(0, 6) : [];
    } catch (e) { return []; }
  }
  function pushHistory(pick) {
    history.unshift({ name: pick.name, region: pick.region, t: Date.now() });
    history = history.slice(0, 6);
    try { localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); } catch (e) {}
    renderHistory();
  }
  function renderHistory() {
    if (!history.length) { historyEl.hidden = true; return; }
    historyEl.hidden = false;
    histList.innerHTML = history.map(function (h) {
      return '<span class="hist-item">' + h.name + "<span>" + h.region + "</span></span>";
    }).join("");
  }

  /* ===================== 吐司 ===================== */
  var toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 2800);
  }

  /* ===================== 初始化 ===================== */
  (function init() {
    var saved = null;
    try { saved = JSON.parse(localStorage.getItem(REGION_KEY) || "null"); } catch (e) {}
    if (saved && saved.key && (saved.key === ALL_KEY || FOODS[saved.key])) {
      setRegion(saved.key, { localized: !!saved.localized });
    } else {
      setRegion(ALL_KEY, { localized: false });
      regionValue.textContent = "定位中…";
    }
    renderHistory();
    // 默认自动定位：先试浏览器 GPS，再退到网络定位，失败则留在全国随机等手动选
    autoLocate(false);

    // 便于预览/分享：?region=四川&demo=1
    try {
      var q = new URLSearchParams(location.search);
      var qr = q.get("region");
      if (qr) { if (FOODS[qr]) setRegion(qr, { localized: false }); else if (qr === "all") setRegion(ALL_KEY, {}); }
      if (q.get("panel")) { document.getElementById("region").classList.add("open"); }
      if (q.get("demo")) {
        var p = drawDish(); lastPick = p; render(p);
      }
    } catch (e) {}
  })();

  // 空格 / 回车也能抽
  document.addEventListener("keydown", function (e) {
    if (e.code === "Space" && document.activeElement === document.body) { e.preventDefault(); roll(); }
  });
})();
</script>
</body>
